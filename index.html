<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Level 2031"><link rel="apple-touch-icon" href="icon-1024.png"><link rel="manifest" href="manifest.webmanifest"><title>Level 2031</title><link rel="stylesheet" href="styles.css">

<script>
(function () {
  function escapeHtml(value) {
    return String(value).replace(/[&<>"]/g, function (c) {
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];
    });
  }

  function showStartupError(error) {
    try {
      var message = error && (error.stack || error.message || String(error));
      var box = document.getElementById('level2031-diagnostic');
      if (!box) {
        box = document.createElement('div');
        box.id = 'level2031-diagnostic';
        box.style.cssText =
          'position:fixed;inset:0;z-index:2147483647;background:#111;color:#fff;' +
          'padding:24px;box-sizing:border-box;font:15px/1.5 -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;' +
          'overflow:auto;white-space:pre-wrap;';
        document.documentElement.appendChild(box);
      }
      box.innerHTML =
        '<h2>Level 2031 startup error</h2>' +
        '<p>The app loaded, but JavaScript reported an error:</p><pre>' +
        escapeHtml(message) +
        '</pre>';
    } catch (_) {}
  }

  window.addEventListener('error', function (event) {
    if (event && event.error) showStartupError(event.error);
  });

  window.addEventListener('unhandledrejection', function (event) {
    showStartupError(event && event.reason ? event.reason : 'Unhandled promise rejection');
  });

  window.addEventListener('load', function () {
    if (!('serviceWorker' in navigator)) return;

    navigator.serviceWorker.register('./sw-v10-final.js?v=12', { updateViaCache: 'none' })
      .then(function (registration) {
        return registration.update().catch(function () {});
      })
      .catch(showStartupError);
  });
})();
</script>

</head><body><div id="app"></div><script src="app.js"></script>
  <script>
    // V9 Visual RPG layer is injected by app.js.
  </script>

<div id="worldScreenHost" style="display:none"></div>
<script>
document.addEventListener("DOMContentLoaded",function(){
  const host=document.getElementById("worldScreenHost");
  if(!host)return;
  const btn=document.createElement("button");
  btn.type="button"; btn.id="v10WorldToggle"; btn.textContent="🌎 World";
  btn.style.cssText="position:fixed;right:14px;bottom:14px;z-index:9999;padding:12px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:#111;color:#fff;font-weight:800;box-shadow:0 8px 30px rgba(0,0,0,.3)";
  document.body.appendChild(btn);
  let open=false;
  btn.onclick=function(){
    open=!open; host.style.display=open?"block":"none";
    if(open && window.Level2031WorldV10) window.Level2031WorldV10.mount();
    window.scrollTo({top:open?host.offsetTop:0,behavior:"smooth"});
  };
});
</script>
</body></html>

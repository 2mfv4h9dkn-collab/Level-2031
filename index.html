<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#f5f5f7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Level 2031" />
<link rel="manifest" href="manifest.json" />
<title>Level 2031</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#17171a;--muted:#707078;--line:#dedee3;--accent:#111;--green:#34c759;--yellow:#ffcc00;--red:#ff3b30;--blue:#007aff;--purple:#5856d6;--shadow:0 10px 30px rgba(0,0,0,.07);--radius:22px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer;border:0}.app{max-width:720px;margin:auto;padding:env(safe-area-inset-top) 16px calc(90px + env(safe-area-inset-bottom));}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 2px 12px}.brand{font-weight:800;letter-spacing:-.7px;font-size:24px}.date{color:var(--muted);font-size:12px;margin-top:2px}.iconbtn{width:42px;height:42px;border-radius:14px;background:#fff;box-shadow:var(--shadow);font-size:19px}.hero{background:var(--card);border:1px solid #ececf0;border-radius:28px;padding:20px;box-shadow:var(--shadow);margin-bottom:14px}.heroTop{display:flex;gap:16px;align-items:center}.avatar{width:72px;height:72px;border-radius:22px;background:linear-gradient(145deg,#111,#555);display:grid;place-items:center;color:#fff;font-size:30px;box-shadow:inset 0 1px rgba(255,255,255,.2)}.eyebrow{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.4px;font-weight:700}.level{font-size:28px;font-weight:850;letter-spacing:-1px;margin:2px 0}.xpbar{height:9px;background:#ececf0;border-radius:99px;overflow:hidden;margin-top:10px}.xpfill{height:100%;background:linear-gradient(90deg,#111,#555);border-radius:99px;transition:.3s}.xptext{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:6px}.missionCard{background:#fff;border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}.missionHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.missionTitle{font-size:19px;font-weight:800;letter-spacing:-.4px}.statusPill{font-size:11px;font-weight:800;padding:7px 10px;border-radius:99px;background:#f0f0f3}.statusPill.green{background:#e8f9ed;color:#16853a}.statusPill.yellow{background:#fff7d6;color:#8a6d00}.statusPill.red{background:#ffe9e7;color:#b4231a}.missionSub{color:var(--muted);font-size:13px;line-height:1.4;margin-bottom:16px}.task{border:1px solid var(--line);border-radius:17px;padding:14px;margin:10px 0;background:#fff}.task.done{border-color:#ccefd5;background:#fbfffc}.taskTop{display:flex;gap:10px;align-items:flex-start}.check{width:25px;height:25px;border:2px solid #b8b8c0;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;margin-top:1px;background:#fff}.task.done .check{background:var(--green);border-color:var(--green);color:#fff}.taskName{font-weight:750;font-size:14px;line-height:1.25}.taskWhy{color:var(--muted);font-size:12px;line-height:1.4;margin:6px 0 0 35px}.inputRow{display:flex;gap:8px;margin:10px 0 0 35px}.inputRow input{width:100%;border:1px solid var(--line);background:#f7f7f9;border-radius:12px;padding:10px 11px;outline:none}.inputRow input:focus{border-color:#888;background:#fff}.unit{padding:10px 8px;color:var(--muted);font-size:12px}.primary{width:100%;background:#111;color:#fff;border-radius:15px;padding:14px;font-weight:800;margin-top:12px}.secondary{background:#f0f0f3;color:#111;border-radius:13px;padding:11px 13px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{background:#fff;border-radius:18px;padding:15px;box-shadow:var(--shadow)}.metricLabel{color:var(--muted);font-size:11px}.metricValue{font-size:23px;font-weight:850;margin-top:3px}.metricSmall{font-size:11px;color:var(--muted)}.sectionTitle{font-size:18px;font-weight:850;margin:22px 2px 10px}.goal{background:#fff;border-radius:18px;padding:15px;margin:9px 0;box-shadow:var(--shadow)}.goalRow{display:flex;justify-content:space-between;gap:10px}.goalName{font-weight:750}.goalPct{font-weight:800}.bar{height:7px;background:#ececf0;border-radius:99px;margin-top:10px;overflow:hidden}.bar>div{height:100%;background:#111;border-radius:99px}.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(250,250,252,.94);backdrop-filter:blur(16px);border-top:1px solid #ddd;z-index:5;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}.tabsInner{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.tab{background:transparent;color:#777;padding:7px 4px;border-radius:12px;font-size:11px}.tab.active{background:#e9e9ed;color:#111;font-weight:800}.tabIcon{display:block;font-size:18px;margin-bottom:2px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.28);backdrop-filter:blur(5px);display:none;align-items:flex-end;z-index:10}.sheet{background:#fff;width:100%;max-width:720px;margin:auto;border-radius:28px 28px 0 0;padding:20px;max-height:88vh;overflow:auto}.modal.open{display:flex}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.close{background:#eee;border-radius:12px;padding:8px 12px}.small{font-size:12px;color:var(--muted);line-height:1.45}.notice{padding:12px;border-radius:14px;background:#f2f2f5;color:#555;font-size:12px;margin:10px 0}.moneyInput{display:grid;grid-template-columns:1fr 1fr;gap:10px}.moneyInput label{font-size:11px;color:var(--muted)}.moneyInput input{width:100%;margin-top:5px;padding:11px;border:1px solid var(--line);border-radius:12px}.hide{display:none!important}@media(min-width:700px){.app{padding-top:20px}.tabs{position:static;border:0;background:transparent;backdrop-filter:none;margin-top:20px}.tabsInner{background:#fff;border-radius:18px;padding:5px;box-shadow:var(--shadow)}}
</style>
</head>
<body>
<div id="app"></div>
<div class="tabs"><div class="tabsInner">
<button class="tab active" data-tab="home"><span class="tabIcon">⌂</span>Today</button>
<button class="tab" data-tab="goals"><span class="tabIcon">◉</span>Goals</button>
<button class="tab" data-tab="progress"><span class="tabIcon">↗</span>Progress</button>
<button class="tab" data-tab="settings"><span class="tabIcon">⚙</span>Settings</button>
</div></div>
<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>
<script>
const START=new Date('2026-09-23T00:00:00');
const END=new Date('2031-09-30T23:59:59');
const GOALS=[
{id:'business',name:'Control AC & Heat',target:'$5,000,000 annual revenue',value:0,targetValue:5000000,unit:'$'},
{id:'income',name:'Personal HVAC income',target:'$250,000 after-tax / year',value:0,targetValue:250000,unit:'$'},
{id:'invest',name:'Long-term investments',target:'$500,000 invested',value:0,targetValue:500000,unit:'$'},
{id:'emergency',name:'Emergency fund',target:'$50,000 cash',value:0,targetValue:50000,unit:'$'},
{id:'realestate',name:'Real estate',target:'4BR/2BA home + rental path',value:0,targetValue:100,unit:'%'},
{id:'trading',name:'Trading discipline',target:'Consistent process; ~$2,000/week target',value:0,targetValue:100,unit:'%'},
{id:'fitness',name:'Health & fitness',target:'~150 lb + athletic lifestyle',value:0,targetValue:100,unit:'%'},
{id:'family',name:'Marriage & family',target:'Marriage, young family, present father',value:0,targetValue:100,unit:'%'},
{id:'development',name:'Personal development',target:'HVAC, leadership, faith, communication',value:0,targetValue:100,unit:'%'}
];
const DAY_TASKS=[
{key:'business',cat:'Business',name:'Complete one 30-minute owner-building task',xp:150,why:'Directly builds the systems, skills, sales or management capacity required to move Control AC & Heat toward $5M revenue.',input:'Task completed',type:'check'},
{key:'money',cat:'Wealth',name:'Record today\'s money movement and invest the planned amount',xp:120,why:'Keeps the $500K investment goal measurable instead of aspirational.',input:'Invested today',type:'money'},
{key:'fitness',cat:'Fitness',name:'Complete the scheduled training session',xp:80,why:'Builds the athletic lifestyle required for the 150-lb health goal.',input:'Minutes',type:'number'},
{key:'faith',cat:'Faith',name:'Complete 30 minutes of Bible reading / prayer',xp:60,why:'Turns spiritual growth into a measurable daily practice.',input:'Minutes',type:'number'},
{key:'family',cat:'Family',name:'Give 30+ minutes of distraction-free quality time to Izzy/family',xp:80,why:'Protects the marriage and family goal while business demands increase.',input:'Minutes',type:'number'},
{key:'trading',cat:'Trading',name:'If you trade today, follow every written risk rule; if you do not trade, review one setup for 15 minutes',xp:100,why:'The 2031 trading goal is based on disciplined execution, not gambling or a single profitable day.',input:'Rule-followed / review completed',type:'check'},
{key:'learning',cat:'Growth',name:'Complete 20 minutes of deliberate learning',xp:60,why:'Develops HVAC, leadership, sales, investing, trading or communication skills.',input:'Minutes',type:'number'}
];
let state=JSON.parse(localStorage.getItem('level2031')||'null')||{date:new Date().toISOString().slice(0,10),xp:0,level:1,answers:{},financials:{investments:0,emergency:0,debt:0,weeklyInvestTarget:1000},history:[],goalValues:{},settings:{name:'Ferris',wake:'04:00'}};
if(!state.goalValues)state.goalValues={};
function save(){localStorage.setItem('level2031',JSON.stringify(state))}
function today(){return new Date().toISOString().slice(0,10)}
function dayNum(){return Math.max(1,Math.floor((new Date(today())-START)/86400000)+1)}
function daysTotal(){return Math.ceil((END-START)/86400000)+1}
function level(){return Math.floor(state.xp/1000)+1}
function xpIn(){return state.xp%1000}
function money(n){return '$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0})}
function pct(v,t){return Math.max(0,Math.min(100,(v/t)*100))}
function mission(){
 const d=new Date(today()).getDay();
 const task=DAY_TASKS.map(x=>({...x}));
 if(d===0) task[0].name='Complete a 45-minute weekly CEO review and write next week\'s #1 business priority';
 if(d===1) task[0].name='Improve one Control AC & Heat process: document it in 30 minutes or less';
 if(d===2) task[0].name='Review 5 recent leads/jobs and record where the next sale or profit improvement can come from';
 if(d===3) task[0].name='Spend 30 minutes learning one HVAC/leadership skill you can apply this week';
 if(d===4) task[0].name='Follow up with 3 customers/leads or review 3 past customers for a specific sales/service opportunity';
 if(d===5) task[0].name='Review weekly business numbers and identify one measurable improvement for next week';
 if(d===6) task[0].name='Spend 30 minutes planning next week\'s business priorities, finances and family time';
 return task;
}
function status(){let a=state.answers[today()]||{};let tasks=mission();let done=tasks.filter(t=>a[t.key]?.done).length;let required=tasks.length;let score=Math.round(done/required*100); if(score>=85)return {c:'green',label:'GREEN',score}; if(score>=60)return {c:'yellow',label:'YELLOW',score}; return {c:'red',label:'RED',score}}
function render(){const tab=document.querySelector('.tab.active')?.dataset.tab||'home';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab)); const app=document.getElementById('app'); if(tab==='home')app.innerHTML=home(); if(tab==='goals')app.innerHTML=goals(); if(tab==='progress')app.innerHTML=progress(); if(tab==='settings')app.innerHTML=settings(); bind();}
function header(){return `<div class="top"><div><div class="brand">Level 2031</div><div class="date">Day ${dayNum()} of ${daysTotal()} • ${new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric',year:'numeric'})}</div></div><button class="iconbtn" id="checkin">✓</button></div>`}
function home(){let st=status(),a=state.answers[today()]||{};let tasks=mission();let completed=tasks.filter(t=>a[t.key]?.done).length;return header()+`<section class="hero"><div class="heroTop"><div class="avatar">${level()}</div><div style="flex:1"><div class="eyebrow">Character progression</div><div class="level">Level ${level()}</div><div class="small">${1000-xpIn()} XP to Level ${level()+1}</div><div class="xpbar"><div class="xpfill" style="width:${xpIn()/10}%"></div></div><div class="xptext"><span>${state.xp.toLocaleString()} XP total</span><span>2031: ${Math.min(100,Math.round(dayNum()/daysTotal()*100))}% elapsed</span></div></div></div></section><section class="missionCard"><div class="missionHead"><div class="missionTitle">Today's Mission</div><div class="statusPill ${st.c}">${st.label} • ${st.score}%</div></div><div class="missionSub">Specific actions tied to your September 2031 goals. ${completed}/${tasks.length} completed.</div>${tasks.map((t,i)=>taskHTML(t,a[t.key]||{})).join('')}<button class="primary" id="finish">Finish today's check-in</button></section><div class="grid"><div class="metric"><div class="metricLabel">Investments</div><div class="metricValue">${money(state.financials.investments)}</div><div class="metricSmall">Goal $500K</div></div><div class="metric"><div class="metricLabel">Emergency Fund</div><div class="metricValue">${money(state.financials.emergency)}</div><div class="metricSmall">Goal $50K</div></div><div class="metric"><div class="metricLabel">Debt</div><div class="metricValue">${money(state.financials.debt)}</div><div class="metricSmall">Track downward</div></div><div class="metric"><div class="metricLabel">Weekly Invest Target</div><div class="metricValue">${money(state.financials.weeklyInvestTarget)}</div><div class="metricSmall">Your current target</div></div></div>`}
function taskHTML(t,a){let done=!!a.done;return `<div class="task ${done?'done':''}" data-key="${t.key}"><div class="taskTop"><button class="check" data-check="${t.key}">${done?'✓':''}</button><div><div class="taskName">${t.name}</div></div></div><div class="taskWhy">+${t.xp} XP • ${t.why}</div>${t.type!=='check'?`<div class="inputRow"><input data-input="${t.key}" type="${t.type==='money'?'number':'number'}" min="0" step="1" placeholder="${t.input}" value="${a.value??''}"><span class="unit">${t.type==='money'?'$':'min'}</span></div>`:''}</div>`}
function goals(){return header()+`<div class="sectionTitle">September 2031 Goals</div>${GOALS.map(g=>{let v=state.goalValues[g.id]??g.value;let p=g.unit==='$'?pct(v,g.targetValue):Number(v);return `<div class="goal"><div class="goalRow"><div><div class="goalName">${g.name}</div><div class="small">${g.target}</div></div><div class="goalPct">${Math.round(p)}%</div></div><div class="bar"><div style="width:${Math.min(100,p)}%"></div></div><div class="small" style="margin-top:7px">Current: ${g.unit==='$'?money(v):v+'%'}</div></div>`}).join('')}<button class="primary" id="editgoals">Update goal progress</button>`}
function progress(){let h=state.history.slice(-14).reverse();return header()+`<div class="sectionTitle">Progress</div><div class="grid"><div class="metric"><div class="metricLabel">Current Level</div><div class="metricValue">${level()}</div><div class="metricSmall">${state.xp.toLocaleString()} XP</div></div><div class="metric"><div class="metricLabel">14-Day Green Days</div><div class="metricValue">${h.filter(x=>x.status==='green').length}</div><div class="metricSmall">Consistency</div></div></div><div class="sectionTitle">Recent Days</div>${h.length?h.map(x=>`<div class="goal"><div class="goalRow"><b>${x.date}</b><span class="statusPill ${x.status}">${x.status.toUpperCase()}</span></div><div class="small">${x.score}% • +${x.xp} XP</div></div>`).join(''):'<div class="notice">Complete your first daily check-in to start your history.</div>'}`}
function settings(){return header()+`<div class="sectionTitle">Settings</div><div class="goal"><div class="goalName">Your name</div><input id="name" value="${state.settings.name}" style="width:100%;margin-top:8px;padding:11px;border:1px solid var(--line);border-radius:12px"></div><div class="goal"><div class="goalName">Daily investment target</div><input id="weekly" type="number" value="${state.financials.weeklyInvestTarget}" style="width:100%;margin-top:8px;padding:11px;border:1px solid var(--line);border-radius:12px"><div class="small" style="margin-top:7px">The original long-term plan uses approximately $1,000/week.</div></div><button class="primary" id="saveSettings">Save settings</button><div class="notice">All data is stored locally in this browser. No account or server is required for this first version.</div>`}
function bind(){document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{let k=b.dataset.check;let a=state.answers[today()]||(state.answers[today()]={});a[k]=a[k]||{};a[k].done=!a[k].done; if(a[k].done){a[k].value=a[k].value||0} save();render()});document.querySelectorAll('[data-input]').forEach(inp=>inp.onchange=()=>{let k=inp.dataset.input;let a=state.answers[today()]||(state.answers[today()]={});a[k]=a[k]||{};a[k].value=Number(inp.value||0);let t=mission().find(x=>x.key===k);a[k].done=t.type==='money'?a[k].value>=0:a[k].value>0;save();render()});document.getElementById('finish')?.addEventListener('click',finish);document.getElementById('checkin')?.addEventListener('click',finish);document.getElementById('editgoals')?.addEventListener('click',goalModal);document.getElementById('saveSettings')?.addEventListener('click',()=>{state.settings.name=document.getElementById('name').value;state.financials.weeklyInvestTarget=Number(document.getElementById('weekly').value||1000);save();render()})}
function finish(){let st=status(),a=state.answers[today()]||{};let already=state.history.find(x=>x.date===today());let xp=mission().filter(t=>a[t.key]?.done).reduce((s,t)=>s+t.xp,0);if(!already){state.xp+=xp;state.history.push({date:today(),status:st.c,score:st.score,xp});save()}showModal(`<div class="row"><div><div class="eyebrow">Daily result</div><h2 style="margin:3px 0">${st.c==='green'?'You won the day.':st.c==='yellow'?'Solid progress.':'Reset and go again.'}</h2></div><button class="close" id="close">Done</button></div><div class="missionCard" style="box-shadow:none;background:#f7f7f9;text-align:center"><div class="statusPill ${st.c}" style="display:inline-block">${st.label}</div><div style="font-size:42px;font-weight:900;margin:10px 0">${st.score}%</div><div class="small">${already?'Today is already recorded.':`You earned ${xp} XP.`}</div></div><div class="notice">Your score is based on completion of specific daily missions. A profitable trading day does not override a rule violation.</div>`)}
function goalModal(){showModal(`<div class="row"><h2>Update progress</h2><button class="close" id="close">Done</button></div>${GOALS.map(g=>`<div class="goal"><div class="goalName">${g.name}</div><div class="small">${g.target}</div><input class="goaledit" data-goal="${g.id}" type="number" min="0" value="${state.goalValues[g.id]??g.value}" style="width:100%;margin-top:8px;padding:11px;border:1px solid var(--line);border-radius:12px"><div class="small">${g.unit==='$'?'Dollar amount':'0–100%'}</div></div>`).join('')}<button class="primary" id="saveGoals">Save progress</button>`);document.getElementById('saveGoals').onclick=()=>{document.querySelectorAll('.goaledit').forEach(i=>state.goalValues[i.dataset.goal]=Number(i.value||0));save();closeModal();render()}}
function showModal(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('open');document.getElementById('close')?.addEventListener('click',closeModal)}function closeModal(){document.getElementById('modal').classList.remove('open')}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');render()});
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body></html>
